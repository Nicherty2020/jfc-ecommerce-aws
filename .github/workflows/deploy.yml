name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  dev:
    uses: ./.github/workflows/deploy-env.yml
    with:
      environment: dev

  prod:
    needs: dev
    uses: ./.github/workflows/deploy-env.yml
    with:
      environment: prod
